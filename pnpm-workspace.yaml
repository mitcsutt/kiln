packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole workspace (ADR 0006).
# Reference these from package.json as "catalog:".
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^3.0.3
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^10.0.1
  '@storybook/addon-a11y': ^10.6.1
  '@storybook/addon-docs': ^10.6.1
  '@storybook/addon-vitest': ^10.6.1
  '@storybook/react-vite': ^10.6.1
  '@tanstack/intent': ^0.5.3
  '@tanstack/react-form': ^1.33.5
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser-playwright': ^5.0.3
  '@vitest/eslint-plugin': ^1.6.27
  axe-core: ^4.13.0
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.2.0
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-jsx-a11y: ^6.10.2
  # Pinned exactly: it has a single maintainer (ADR 0037).
  eslint-plugin-project-structure: 3.14.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  eslint-plugin-storybook: ^10.6.1
  eslint-plugin-testing-library: ^7.16.2
  globals: ^17.13.0
  jsdom: ^26.1.0
  lefthook: ^2.1.16
  lightningcss: ^1.33.0
  playwright: ^1.63.0
  prettier: ^3.9.9
  publint: ^0.3.25
  radix-ui: ^1.6.7
  shiki: ^4.5.0
  react: ^19.3.0
  react-dom: ^19.3.0
  storybook: ^10.6.1
  turbo: ^2.11.7
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2
  vitest: ^5.0.3
  zod: ^4.6.5

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true
  workerd: true

peerDependencyRules:
  # eslint-plugin-jsx-a11y has not declared ESLint 10 support yet. The
  # kiln-eslint-config tests run its rules on ESLint 10 to prove they work.
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

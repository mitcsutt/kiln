# Git hooks, installed by the lefthook package on `pnpm install`.
# See https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  jobs:
    - name: format
      # Each CLAUDE.md is a symlink to AGENTS.md, and Prettier refuses a symlink passed by name.
      exclude: ['**/CLAUDE.md', 'CLAUDE.md']
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm exec eslint --fix --max-warnings=0 --no-warn-ignored {staged_files}
      stage_fixed: true

    # apps/demo uses every export (apps/demo/AGENTS.md): catch an added or removed one at commit.
    - name: demo-coverage
      glob: 'packages/*/src/**/index.ts'
      run: node apps/demo/scripts/check-coverage.ts

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

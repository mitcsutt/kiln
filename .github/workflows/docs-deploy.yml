name: Deploy docs

# Builds the docs site and deploys it to the `kiln-docs` Cloudflare Worker, which serves it
# at kiln.mitchellsutton.com (ADR 0034). It runs on every push to main that changes something
# the site is built from, and on demand. It isn't part of CI, so the "CI passed" gate never
# waits for it. The custom domain, the API token and these secrets are managed outside this
# repository: CLOUDFLARE_API_TOKEN (allowed to deploy Workers) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/ui/**
      - packages/forms/**
      - packages/tsconfig/**
      - DESIGN.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .nvmrc
      - .github/actions/setup/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled halfway. A newer push waits, and replaces any push
# already waiting, so the last merge is the one that ends up live.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    name: Build and deploy the docs
    if: github.repository == 'mitcsutt/kiln'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the static site
        run: pnpm turbo run build --filter=@mitcsutt/kiln-docs
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: ${{ github.event_name }} ${{ github.sha }}
        run: pnpm --filter @mitcsutt/kiln-docs exec wrangler deploy --message "$MESSAGE"

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# One job per quality gate, each through Turborepo. Add new gates as new jobs
# that reuse the setup action.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint and Prettier
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  test-react18:
    name: Test (React 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test on React 18.3
        run: pnpm test:react18

  # Every story is a browser test: it renders, its play function passes and axe finds
  # no violations. Run once per built-in theme and mode (ADR 0018).
  storybook-test:
    name: Storybook tests (${{ matrix.theme }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [paper, monograph, ledger, fiesta, flightdeck, riso]
        mode: [light, dark]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @mitcsutt/kiln-storybook exec playwright install --with-deps --only-shell chromium
      - name: Story, interaction and a11y tests
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
          STORYBOOK_MODE: ${{ matrix.mode }}
        run: pnpm test:storybook

  storybook-build:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the static Storybook
        run: pnpm turbo run build --filter=@mitcsutt/kiln-storybook
      - name: Install Chromium
        run: pnpm --filter @mitcsutt/kiln-storybook exec playwright install --with-deps --only-shell chromium
      - name: Serve it under /storybook and load a story
        run: pnpm --filter @mitcsutt/kiln-storybook check:static

  # The docs site builds as a deployable artefact (nothing is deployed), and every
  # internal link and anchor in it resolves (ADR 0019).
  docs:
    name: Docs build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the docs site and check its links
        run: pnpm check:links

  # The skills kiln-ui and kiln-forms ship pass TanStack Intent's validator: their
  # frontmatter and size, and every code block compiles against the package (ADR 0020).
  skills:
    name: Agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: intent validate
        run: pnpm check:skills

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: publint and arethetypeswrong
        run: pnpm check:package

  size:
    name: Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Size report against budgets
        id: size
        continue-on-error: true
        run: pnpm size

      # On a pull request, measure the base branch too and comment the difference.
      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: .base
        run: |
          pnpm install --frozen-lockfile
          if node -e "process.exit(require('./package.json').scripts?.size ? 0 : 1)"; then pnpm size; fi
      - name: Write the size comment
        if: always() && github.event_name == 'pull_request'
        run: |
          : > "$RUNNER_TEMP/size-comment.md"
          for report in packages/*/.size/report.json; do
            [ -f "$report" ] || continue
            node size-report.ts --markdown "$RUNNER_TEMP/size-part.md" --head "$report" --base ".base/$report"
            cat "$RUNNER_TEMP/size-part.md" >> "$RUNNER_TEMP/size-comment.md"
          done
      - name: Comment on the pull request
        # A pull request from a fork gets a read-only token, so it can't comment.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: size-report
          path: ${{ runner.temp }}/size-comment.md
          ignore_empty: true

      - name: Fail when a size check fails
        if: steps.size.outcome == 'failure'
        run: exit 1

  # A pull request that changes a published package must add a changeset
  # (ADR 0008). Use `pnpm changeset --empty` when a change needs no release.
  # The Version packages pull request consumes changesets, so it is skipped.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Require a changeset for changed packages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
